<!doctype html>
<!-- CLEAR TO LAND — you are the tower at Kestrel Field. Draw each plane's route
     home: click a plane, drag its path, stack the three altitude bands, land
     arrivals on the cone, launch departures out their gates. WIN: hold the
     field through all 9 shifts, the last against THE GALE WALL. LOSE: three
     incidents close the field. Tech: fixed-step deterministic simulation in
     plain scripts (no library, no network), seeded streams, WebAudio synth,
     canvas chart rendering. The sim modules are DOM-free and replay headlessly
     in Node; tools verify determinism and stage the screenshots from real
     sampled ticks of bot-flown runs. -->
